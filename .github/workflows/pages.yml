name: Build and publish Starworld
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q -j /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Import and export the browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/play
          python3 scripts/apply_web_adapters.py
          python3 scripts/check_web_contract.py
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script tools/prepare_web.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script tools/bake_web_grid.gd -- --test-session 2>&1 | tee /tmp/grid.log
          test -s game/data/content/walk_grid_web.bin
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release Web ../site/play/index.html 2>&1 | tee /tmp/export.log
          test -s site/play/index.wasm
          test -s site/play/index.pck
          python3 scripts/fingerprint_pack.py
          touch site/.nojekyll
          du -h site/play/*
      - name: Check real browser startup and audio output
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8765 --directory site >/tmp/http.log 2>&1 &
          node scripts/browser_v17_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
