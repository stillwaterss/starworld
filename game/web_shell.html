<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星星人的小世界</title>
$GODOT_HEAD_INCLUDE
<style>
@font-face{font-family:StarworldUI;src:url("../assets/starworld-ui.ttf") format("truetype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161c43;color:#fff;font:16px/1.8 StarworldUI,system-ui,"Microsoft YaHei",sans-serif}#canvas{display:block;outline:none}#cover{position:fixed;inset:0;background:linear-gradient(0deg,#101631ed,transparent 85%),url('../assets/world-cover.webp') center/cover;display:flex;align-items:flex-end;padding:6vh 7vw;z-index:5}.panel{max-width:650px}h1{font-weight:600;font-size:clamp(30px,5vw,64px);margin:12px 0;letter-spacing:.06em}.eyebrow{font-size:13px;letter-spacing:.25em;color:#f8da9b}p{color:#eee7f6}button{font:inherit;border:1px solid #ffe3a4;border-radius:30px;padding:12px 28px;background:#ffe0a0;color:#343047;cursor:pointer}button:disabled{opacity:.6;cursor:wait}progress{display:block;width:min(540px,80vw);height:7px;accent-color:#ffdf98;margin:22px 0 12px}#message{white-space:pre-line;min-height:25px;font-size:14px}small{display:block;font-size:12px;color:#d8d0e5;margin-top:15px}#sound{position:fixed;top:15px;right:18px;z-index:8;font-size:13px;padding:8px 17px;background:#21294bd9;color:#fff4d4;border-color:#ac9a73}#audio-note{position:fixed;top:62px;right:18px;z-index:8;font-size:12px;background:#202841d9;padding:5px 10px;border-radius:8px;max-width:260px}#home{color:#e8e0f2;margin-left:20px;font-size:14px}body.ready #cover{display:none}#audio-note:empty{display:none}
</style></head><body><canvas id="canvas" tabindex="0"></canvas><section id="cover"><div class="panel"><span class="eyebrow">云海之上 · 一起慢慢散步</span><h1>星星人的小世界</h1><p>走过木桥，去看看星光下的邻居。<br>也可以找张椅子，让晚风陪你坐一会儿。</p><button id="start">开始旅行 · 开启声音</button><a id="home" href="../">返回首页</a><progress id="progress" value="0" max="1"></progress><div id="message">点击开始后下载游戏。建议使用电脑 Chrome / Edge。</div><small>封面为世界概念图 · WASD 移动 / E 互动 / Esc 释放鼠标<br>存档保留在当前浏览器；首次打开仍需下载引擎和场景。</small></div></section><button id="sound">开启声音</button><div id="audio-note" role="status"></div>
<script>
window.starworldAudioContexts=[];window.starworldAudioMeters=[];window.starworldAudioPeak=0;
const NativeContext=window.AudioContext||window.webkitAudioContext;
if(NativeContext){const Wrapped=new Proxy(NativeContext,{construct(target,args){const ctx=Reflect.construct(target,args);window.starworldAudioContexts.push(ctx);if(navigator.userActivation?.hasBeenActive)ctx.resume().catch(()=>{});return ctx;}});window.AudioContext=Wrapped;if(window.webkitAudioContext)window.webkitAudioContext=Wrapped;
const connect=AudioNode.prototype.connect;AudioNode.prototype.connect=function(destination,...args){if(window.starworldAudioContexts.includes(this.context)&&destination===this.context.destination){const meter=this.context.createAnalyser();meter.fftSize=512;connect.call(this,meter);window.starworldAudioMeters.push(meter);}return connect.call(this,destination,...args);};}
function resumeAudio(){for(const ctx of window.starworldAudioContexts)if(ctx.state==='suspended')ctx.resume().catch(()=>{});}
addEventListener('pointerdown',resumeAudio,true);addEventListener('keydown',resumeAudio,true);
let wantsSound=false,gameReady=false;const sound=document.getElementById('sound'),note=document.getElementById('audio-note');
sound.onclick=()=>{wantsSound=true;resumeAudio();if(window.starworldEnableSound)window.starworldEnableSound();note.textContent='正在开启声音…';document.getElementById('canvas').focus();};
setInterval(()=>{let peak=0;for(const m of window.starworldAudioMeters){const a=new Float32Array(m.fftSize);m.getFloatTimeDomainData(a);let sum=0;for(const x of a)sum+=x*x;peak=Math.max(peak,Math.sqrt(sum/a.length));}window.starworldAudioPeak=Math.max(window.starworldAudioPeak,peak);if(peak>.00002){sound.textContent='声音已开启 · 恢复';note.textContent='';}else if(gameReady&&wantsSound){sound.textContent='开启声音';note.textContent='若仍无声，请点击开启声音，并检查标签页是否静音。';}},1500);
window.starworldDiagnostics=()=>({ready:gameReady,contexts:window.starworldAudioContexts.map(c=>({state:c.state,sampleRate:c.sampleRate})),peakRms:window.starworldAudioPeak,meters:window.starworldAudioMeters.length});
</script><script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;config.mainPack = config.executable + ".pck";config.fileSizes[config.mainPack]=config.fileSizes[config.executable+".pck"];const engine=new Engine(config),start=document.getElementById('start'),progress=document.getElementById('progress'),message=document.getElementById('message');
start.onclick=async()=>{start.disabled=true;wantsSound=true;resumeAudio();const missing=Engine.getMissingFeatures({threads:false});if(missing.length){message.textContent='浏览器暂不支持：'+missing.join('、');start.disabled=false;return;}
try{await engine.startGame({onProgress(current,total){if(total>0){progress.max=total;progress.value=current;message.textContent=current<total?'正在下载 '+(current/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB':'资源下载完成，正在布置小世界…';}else{progress.removeAttribute('value');message.textContent='正在准备游戏引擎…';}}});message.textContent="正在布置小世界…";while(!window.starworldSceneReady)await new Promise(requestAnimationFrame);gameReady=true;document.body.classList.add('ready');resumeAudio();if(wantsSound&&window.starworldEnableSound)window.starworldEnableSound();document.getElementById('canvas').focus();}
catch(error){console.error(error);message.textContent='加载未完成：'+error.message+'\n请检查网络后重试。';start.disabled=false;start.textContent='重新加载';start.onclick=()=>location.reload();}};
</script></body></html>
