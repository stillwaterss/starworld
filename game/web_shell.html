const starworldDevice = new URLSearchParams(location.search).get('device');

document.body.classList.toggle('mobile', window.starworldMobile);
if (window.starworldMobile) {
  const fullscreen = document.getElementById('phone-full');
  fullscreen.hidden = !document.documentElement.requestFullscreen;
  fullscreen.onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else {
        await document.documentElement.requestFullscreen();
        try { await screen.orientation?.lock?.('landscape'); } catch {}
      }
    } catch {}
  };
  document.addEventListener('fullscreenchange', () => {
    fullscreen.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });
  document.getElementById('recover-play').onclick = () => location.reload();
  const canvas = document.getElementById('canvas');
  canvas.addEventListener('webglcontextlost', () => { document.getElementById('game-recovery').hidden = false; });
  const sound = document.getElementById('sound');
  new MutationObserver(() => sound.classList.toggle('playing-sound', sound.textContent.includes('已开启'))).observe(sound, { childList:true, subtree:true, characterData:true });

}
