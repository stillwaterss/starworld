<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星星人的小世界</title><link rel="icon" href="../assets/app_icon.png">
$GODOT_HEAD_INCLUDE
<style>
@font-face{font-family:StarworldUI;src:url("../assets/starworld-ui-v17-animations.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161c43;color:#fff;font:16px/1.8 StarworldUI,system-ui,"Microsoft YaHei",sans-serif}#canvas{display:block;outline:none}#cover{position:fixed;inset:0;background:linear-gradient(0deg,#101631ed,transparent 85%),url('../assets/world-cover.webp') center/cover;display:flex;align-items:flex-end;padding:6vh 7vw;z-index:5}.panel{max-width:650px}h1{font-weight:600;font-size:clamp(30px,5vw,64px);margin:12px 0;letter-spacing:.06em}.eyebrow{font-size:13px;letter-spacing:.25em;color:#f8da9b}p{color:#eee7f6}button{font:inherit;border:1px solid #ffe3a4;border-radius:30px;padding:12px 28px;background:#ffe0a0;color:#343047;cursor:pointer}button:disabled{opacity:.6;cursor:wait}progress{display:block;width:min(540px,80vw);height:7px;accent-color:#ffdf98;margin:22px 0 12px}#message{white-space:pre-line;min-height:25px;font-size:14px}small{display:block;font-size:12px;color:#d8d0e5;margin-top:15px}#sound{position:fixed;bottom:78px;left:18px;z-index:8;font-size:13px;padding:8px 17px;background:#21294bd9;color:#fff4d4;border-color:#ac9a73}#audio-note{position:fixed;bottom:122px;left:18px;z-index:8;font-size:12px;background:#202841d9;padding:5px 10px;border-radius:8px;max-width:260px}#home{color:#e8e0f2;margin-left:20px;font-size:14px}body.ready #cover{display:none}#audio-note{pointer-events:none}#audio-note:empty{display:none}

#name-dialog{width:min(440px,90vw);padding:26px;border:2px solid #dcb879;border-radius:22px;background:#fff7e9;color:#5b4131;font:inherit;text-align:center;box-shadow:0 12px 45px #151b4266}#name-dialog::backdrop{background:#141a3c99}#name-dialog h2{margin:0 0 14px;font-size:26px}#name-dialog input{box-sizing:border-box;width:100%;font:inherit;font-size:22px;text-align:center;padding:8px;background:#fffcf5;color:#5b4131;border:2px solid #dfc390;border-radius:12px}#name-dialog input:focus{outline:2px solid #a65c35;outline-offset:2px}#name-dialog footer{display:flex;justify-content:center;gap:12px;margin-top:18px}#name-dialog button[type=submit]{background:#e9a16e}#load-detail{font-size:13px;color:#f5ddaa}#load-detail:empty{display:none}
</style></head><body><canvas id="canvas" tabindex="0"></canvas><section id="cover"><div class="panel"><span class="eyebrow">云海之上 · 一起慢慢散步</span><h1>星星人的小世界</h1><p>走过木桥，去看看星光下的邻居。<br>也可以找张椅子，让晚风陪你坐一会儿。</p><button id="start" disabled>正在准备启动…</button><a id="home" href="../">返回首页</a><progress id="progress" value="0" max="1"></progress><div id="message" role="status">正在准备启动程序，就绪后可以开始旅行。</div><div id="load-detail"></div><small>封面为游戏主题插画 · WASD 移动 / E 互动 / Esc 释放鼠标<br>存档保留在当前浏览器；首次打开仍需下载引擎和场景。</small></div></section><button id="sound">开启声音</button><div id="audio-note" role="status"></div>
<dialog id="name-dialog" aria-labelledby="name-heading">
<form id="name-form">
<h2 id="name-heading">给星星人改个名字</h2>
<input id="star-name" aria-label="星星人的名字" maxlength="8" autocomplete="off" spellcheck="false" autofocus>
<footer><button type="button" id="cancel-name">取消</button><button type="submit">确定</button></footer>
</form>
</dialog>
<script src="../assets/play-name.js"></script>
<script>
// Keep the game save/load keys from triggering browser shortcuts while playing.
addEventListener('keydown',event=>{
 if((event.code==='F5'||event.code==='F9')&&document.body.classList.contains('ready'))event.preventDefault();
},true);
</script><script src="../assets/web-audio-v172.js"></script><script src="$GODOT_URL" onerror="document.getElementById('message').textContent='启动程序加载失败，请刷新重试。';document.getElementById('start').textContent='重新加载';document.getElementById('start').disabled=false;document.getElementById('start').onclick=()=>location.reload()"></script><script>
if(typeof Engine === "function"){
const config=$GODOT_CONFIG;config.mainPack = config.executable + ".pck";config.fileSizes[config.mainPack]=config.fileSizes[config.executable+".pck"];const previewMode=new URLSearchParams(location.search).get("preview"),endingPreview=previewMode==="ending"||previewMode==="flight";if(endingPreview){config.args=["--","--test-session","--visual-review","--no-opening","--show-finale","--ending-preview"];document.querySelector("h1").textContent="小光的归途 · 送别体验";document.querySelector(".panel p").textContent="从飞艇码头直接出发，陪小光回到星空。这是独立体验进度，不会改变你原来的旅程。";}if(previewMode==="flight"){config.args.push("--flight-preview");document.querySelector("h1").textContent="飞艇往返 · 独立测试";}config.onExit = () => window.location.assign("../");const engine=new Engine(config),start=document.getElementById('start'),progress=document.getElementById('progress'),message=document.getElementById('message');
const detail = document.getElementById('load-detail');
function showPreparation(text) {
  message.textContent = text;
  progress.removeAttribute('value');
}
start.onclick = async () => {
  start.disabled = true;
  window.starworldRequestSound();
  const missing = Engine.getMissingFeatures({threads:false});
  if (missing.length) {
    message.textContent = '浏览器暂不支持：' + missing.join('、');
    start.disabled = false;
    return;
  }
  const began = performance.now();
  detail.textContent = '首次下载和布置场景可能需要几分钟，请保持此页面打开。';
  showPreparation('正在准备游戏引擎…');
  const clock = setInterval(() => {
    const seconds = Math.floor((performance.now() - began) / 1000);
    detail.textContent = '已等待 ' + seconds + ' 秒。首次下载和布置场景可能需要几分钟。';
  }, 1000);
  try {
    await engine.startGame({onProgress(current, total) {
      if (total > 0 && current < total) {
        progress.max = total;
        progress.value = current;
        message.textContent = '正在下载 ' + (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
      } else if (total > 0) {
        showPreparation('下载完成，正在启动引擎和布置场景…');
      }
    }});
    showPreparation('正在布置小世界，首次进入会稍久一些…');
    while (!window.starworldSceneReady) {
      const warm = window.starworldWarmup;
      if (warm) {
        progress.max = warm.total;
        progress.value = warm.stage;
        message.textContent = (warm.label || '正在准备小镇画面') + ' · ' + warm.stage + ' / ' + warm.total;
      }
      await new Promise(requestAnimationFrame);
    }
    document.body.classList.add('ready');
    window.starworldStartAudio();
    document.getElementById('canvas').focus();
  } catch (error) {
    console.error(error);
    message.textContent = '加载未完成：' + error.message + '\n请检查网络后重试。';
    detail.textContent = '';
    start.disabled = false;
    start.textContent = '重新加载';
    start.onclick = () => location.reload();
  } finally {
    clearInterval(clock);
  }
};
start.disabled=false;start.textContent='开始旅行 · 开启声音';message.textContent='点击开始后下载游戏。建议使用电脑 Chrome / Edge。';
}
</script></body></html>
